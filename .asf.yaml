# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Deploy Plugin"
  homepage: https://maven.apache.org/plugins/maven-deploy-plugin
  labels:
    - java
    - build-management
    - apache-maven
    - maven-plugins
    - maven-deploy-plugin
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - MDEPLOY
  protected_branches:
    master: { }
    maven-deploy-plugin-3.x: { }
  pull_requests:
    del_branch_on_merge: true
  features:
    issues: true

notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-deploy-plugin
project:
  metadata:
    key: maven-deploy-plugin
    committee: maven
    name: Apache Maven Deploy Plugin
    description: Uploads the project artifacts to the internal remote repository.
    short_description: Uploads the project artifacts to the internal remote repository.
    homepage: https://maven.apache.org/plugins/maven-deploy-plugin/
    download_page: https://maven.apache.org/plugins/maven-deploy-plugin/download.cgi
    bug_database: https://maven.apache.org/plugins/maven-deploy-plugin/issue-management.html
    mailing_lists: https://maven.apache.org/plugins/maven-deploy-plugin/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-deploy-plugin.git
    categories:
      - build-management
    programming_languages:
      - Java
    version_method: semver
    cycle_match: (\d+)\..*
  policy:
    github_repository_name: maven-deploy-plugin
    download_path_suffix: plugins
  features:
    atr_sync: true
