# The first run deploys at the end of a serial build, the second one with two threads (MDEPLOY-169). The second
# run uses its own repository, since the first one has already filled the repository from the POM. The relative
# file: URL resolves against the Maven working directory, which the invoker sets to this directory.
invoker.goals.1 = deploy
invoker.goals.2 = clean deploy -T2 -DaltDeploymentRepository=parallel::file:target/parallel-repo
